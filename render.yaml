services:
  - type: web
    name: data-room-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace api
    startCommand: npm run start:render --workspace api
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_ACCESS_TOKEN_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_TOKEN_SECRET
        generateValue: true
      - key: JWT_REFRESH_TOKEN_EXPIRATION
        value: 7d
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
